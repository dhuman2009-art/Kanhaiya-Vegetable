<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanhaiya Vegetable - Fresh & Organic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Header -->
    <header class="bg-green-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold">🌿 Kanhaiya Vegetable</h1>
            <button onclick="openAdminModal()" class="bg-white text-green-700 px-3 py-1 rounded text-sm font-semibold shadow">Admin Login</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 pb-24">
        <section class="mb-6 bg-green-50 p-4 rounded-xl border border-green-200">
            <h2 class="text-lg font-bold text-green-800">Fresh Sabzi Direct Farm Se!</h2>
            <p class="text-sm text-green-600">Taaza sabziyan chunen aur ghar baithe order paayein.</p>
        </section>

        <!-- Product List -->
        <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Dynamic Products will load here -->
        </div>
    </main>

    <!-- Cart Bottom Bar -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg hidden">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500">Total Amount:</p>
                <p id="cart-total" class="text-lg font-bold text-green-600">₹0</p>
            </div>
            <button onclick="checkout()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold shadow">Order Karein</button>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm">
            <h3 class="text-lg font-bold mb-4">Owner Login</h3>
            <input type="email" id="admin-email" placeholder="Email" class="w-full border p-2 mb-3 rounded">
            <input type="password" id="admin-password" placeholder="Password" class="w-full border p-2 mb-4 rounded">
            <div class="flex justify-end gap-2">
                <button onclick="closeAdminModal()" class="px-4 py-2 text-gray-600">Cancel</button>
                <button onclick="loginAdmin()" class="bg-green-600 text-white px-4 py-2 rounded">Login</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZ3TuB32VIj3kVg74C0ZGwLYsKN8pmw9I",
            authDomain: "kanhaiya-vegetable.firebaseapp.com",
            projectId: "kanhaiya-vegetable",
            storageBucket: "kanhaiya-vegetable.firebasestorage.app",
            messagingSenderId: "920146645320",
            appId: "1:920146645320:web:58f7b2e3fd7a9aeaa9a37d",
            measurementId: "G-NX5H7Q9J7N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.loadProducts = async function() {
            const container = document.getElementById('product-list');
            container.innerHTML = '<p class="text-center col-span-2">Loading sabziyan...</p>';
            const querySnapshot = await getDocs(collection(db, "products"));
            container.innerHTML = '';
            if(querySnapshot.empty) {
                container.innerHTML = '<p class="text-center col-span-2 text-gray-500">Jaldi hi sabziyan add hongi!</p>';
                return;
            }
            querySnapshot.forEach((docSnap) => {
                const p = docSnap.data();
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow border flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-lg">${p.name}</h3>
                            <p class="text-green-600 font-semibold">₹${p.price} / ${p.unit}</p>
                        </div>
                        <button onclick="alert('Order feature active!')" class="bg-green-100 text-green-700 px-4 py-2 rounded-lg text-sm font-semibold">Add</button>
                    </div>`;
            });
        }
        loadProducts();

        window.openAdminModal = () => document.getElementById('admin-modal').classList.remove('hidden');
        window.closeAdminModal = () => document.getElementById('admin-modal').classList.add('hidden');
        
        window.loginAdmin = async () => {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                alert('Login Successful!');
                closeAdminModal();
            } catch(e) {
                alert('Login Failed: ' + e.message);
            }
        };
    </script>
</body>
</html>
